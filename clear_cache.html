<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>清除周报缓存</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
        }
        button {
            background: #1890ff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #40a9ff;
        }
        .danger {
            background: #ff4d4f;
        }
        .danger:hover {
            background: #ff7875;
        }
        .success {
            color: #52c41a;
            margin-top: 20px;
            font-weight: bold;
        }
        .info {
            color: #666;
            margin-top: 10px;
            font-size: 14px;
        }
        .warning {
            background: #fff7e6;
            border: 1px solid #ffd591;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            color: #d46b08;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ 周报数据管理</h1>
        <p>如果周报页面显示空白或数据不正确，请使用下方工具</p>

        <div class="warning">
            ⚠️ 注意：清除缓存后，所有未保存的编辑将丢失！
        </div>

        <button onclick="clearCache()" class="danger">清除缓存并重新加载</button>
        <button onclick="checkData()">检查当前数据</button>
        <button onclick="window.location.href='http://localhost:5174'">返回主页</button>

        <div id="message"></div>
    </div>
    <script>
        function clearCache() {
            localStorage.removeItem('weekly-reports-v2');
            localStorage.removeItem('weekly-report-current-user');
            document.getElementById('message').innerHTML =
                '<div class="success">✅ 缓存已清除！</div>' +
                '<div class="info">请刷新主页，系统将自动加载新数据</div>' +
                '<div class="info">预期加载 75 条周报记录（5周 × 15科室）</div>';
        }

        function checkData() {
            const data = localStorage.getItem('weekly-reports-v2');
            if (!data) {
                document.getElementById('message').innerHTML =
                    '<div class="info">❌ 未找到周报数据</div>' +
                    '<div class="info">请访问主页的"周报管理 V2"页面，系统将自动初始化数据</div>';
                return;
            }

            try {
                const reports = JSON.parse(data);
                const weeks = [...new Set(reports.map(r => r.weekLabel))].sort();
                const depts = [...new Set(reports.map(r => r.dept))].sort();

                document.getElementById('message').innerHTML =
                    '<div class="success">✅ 找到 ' + reports.length + ' 条周报数据</div>' +
                    '<div class="info">覆盖周次: ' + weeks.join(', ') + '</div>' +
                    '<div class="info">覆盖科室: ' + depts.length + ' 个</div>' +
                    '<div class="info">示例科室: ' + depts.slice(0, 5).join(', ') + '...</div>';
            } catch (e) {
                document.getElementById('message').innerHTML =
                    '<div class="info">❌ 数据格式错误: ' + e.message + '</div>';
            }
        }

        // 页面加载时自动检查
        window.onload = checkData;
    </script>
</body>
</html>
