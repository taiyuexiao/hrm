app:
  # 数据文件存放目录，支持环境变量覆盖，默认当前目录下的 data
  data-dir: ${DATA_DIR:./data}

server:
  port: ${SERVER_PORT:8080}
  compression:
    # 全量周报等 JSON 响应 gzip：1.8MB → 约 150KB，内网首次加载与轮询明显提速
    enabled: true
    mime-types: application/json,application/javascript,text/css,text/html,text/plain
    min-response-size: 2KB

spring:
  datasource:
    url: jdbc:sqlite:${app.data-dir}/hr.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # 高峰期 20-30 并发：单连接会把所有请求串行排队；WAL 模式下读并发安全
      # 写操作由 SQLite 单写者串行兜底，busy_timeout 防止偶发 SQLITE_BUSY
      maximum-pool-size: 10
      connection-init-sql: PRAGMA busy_timeout=3000

jwt:
  secret: ${JWT_SECRET:intelligent-hr-system-secret-key}
  expiration: ${JWT_EXPIRATION:86400000}

report:
  legacy-data-file: ${app.data-dir}/weekly-reports.json

llm:
  # 大模型网关配置：前端不再直接调用 LLM，统一由后端转发
  # 生产环境请通过以下方式之一配置（优先级从高到低）：
  # 1. 与 jar 同目录的 application.yml / application.properties
  # 2. 环境变量 LLM_BASE_URL / LLM_API_KEY / LLM_MODEL
  # 3. 启动参数 --llm.api-key=xxx
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}
  chat-completion-path: ${LLM_CHAT_COMPLETION_PATH:/chat/completions}
  # 连接/读取超时（毫秒）
  connect-timeout: ${LLM_CONNECT_TIMEOUT:10000}
  read-timeout: ${LLM_READ_TIMEOUT:120000}
