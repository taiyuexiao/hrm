server:
  port: 8081
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:sqlite:data/hr.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

jwt:
  secret: intelligent-hr-system-secret-key
  expiration: 86400000

report:
  legacy-data-file: data/weekly-reports.json
